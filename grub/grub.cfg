set timeout=0
set default=0
insmod search
insmod search_fs_file
search --file --set=root /boot/kernel.elf
set prefix=($root)/boot/grub
insmod all_video
insmod gfxterm
loadfont /boot/grub/fonts/unicode.pf2
set gfxmode=1920x1080x32,1920x1080,auto
set gfxpayload=keep
terminal_output gfxterm

menuentry "jabulOS Aero" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd/initrd.tar initrd
    boot
}
